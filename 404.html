<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Mayur Patil</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-weight: 100 900;
        font-display: swap;
        src: url('%BASE_URL%fonts/inter-latin-opsz-normal.woff2') format('woff2-variations');
      }
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #000;
        color: #f5f5f7;
        font-family: 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        padding: 24px;
      }
      p {
        margin: 0;
      }
      .eyebrow {
        color: #5fd4dc;
        font-weight: 600;
        font-size: 17px;
      }
      h1 {
        margin: 12px 0 0;
        font-size: clamp(40px, 9vw, 88px);
        line-height: 1;
        letter-spacing: -0.045em;
        font-weight: 650;
      }
      .lead {
        margin-top: 20px;
        color: #a1a1a6;
        font-size: 19px;
        line-height: 1.45;
      }
      a {
        display: inline-flex;
        align-items: center;
        height: 48px;
        margin-top: 32px;
        padding: 0 22px;
        border-radius: 999px;
        background: #f5f5f7;
        color: #000;
        font-weight: 500;
        font-size: 17px;
        text-decoration: none;
      }
      a:hover {
        background: #fff;
      }
      a:focus-visible {
        outline: 2px solid #5fd4dc;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Off the charts.</h1>
      <p class="lead">This page doesn’t exist — let’s get you back on course.</p>
      <a href="%BASE_URL%">Return home</a>
    </main>
  </body>
</html>
